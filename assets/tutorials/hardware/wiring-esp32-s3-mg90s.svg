<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Segoe UI, Bahnschrift, DejaVu Sans, Arial, sans-serif">
  <!-- SPIDER wiring diagram: YD-ESP32-S3 (ESP32-S3-WROOM-1 N8R2) + MG90S micro servo. Drawn for this project. -->
  <rect width="1000" height="600" fill="#08080b"/>
  <text x="30" y="34" fill="#ff1f3d" font-size="20" font-weight="700">WIRING  -  YD-ESP32-S3 (N8R2)  +  MG90S MICRO SERVO</text>

  <!-- board -->
  <rect x="60" y="60" width="830" height="230" rx="10" fill="#111116" stroke="#ff1f3d" stroke-width="2"/>
  <rect x="72" y="84" width="200" height="170" rx="4" fill="#1d1d24" stroke="#5a5a66"/>
  <text x="172" y="160" fill="#d8d8e0" font-size="14" text-anchor="middle" font-weight="600">ESP32-S3-WROOM-1</text>
  <text x="172" y="180" fill="#9a9aa8" font-size="12" text-anchor="middle">N8R2: 8 MB flash, 2 MB PSRAM</text>
  <!-- buttons -->
  <rect x="330" y="96" width="34" height="34" rx="4" fill="#2a2a30" stroke="#666"/>
  <text x="347" y="90" fill="#bbb" font-size="11" text-anchor="middle">RST</text>
  <rect x="380" y="96" width="34" height="34" rx="4" fill="#2a2a30" stroke="#666"/>
  <text x="397" y="90" fill="#bbb" font-size="11" text-anchor="middle">BOOT</text>
  <!-- RGB LED + pad -->
  <rect x="560" y="150" width="34" height="34" rx="3" fill="#f2f2f2" stroke="#999"/>
  <text x="577" y="200" fill="#ddd" font-size="11" text-anchor="middle">RGB LED</text>
  <rect x="520" y="118" width="22" height="10" fill="#c9a227"/>
  <text x="531" y="112" fill="#ffcc4d" font-size="11" text-anchor="middle">"RGB" pad</text>
  <!-- IN-OUT pad -->
  <rect x="740" y="232" width="26" height="10" fill="#c9a227"/>
  <text x="753" y="226" fill="#ffcc4d" font-size="11" text-anchor="middle">"IN-OUT" pad</text>
  <!-- USB ports -->
  <rect x="870" y="92" width="40" height="52" rx="8" fill="#3a3a44" stroke="#aaa"/>
  <rect x="870" y="182" width="40" height="52" rx="8" fill="#3a3a44" stroke="#aaa"/>
  <text x="920" y="114" fill="#38c8ff" font-size="12">COM</text>
  <text x="920" y="130" fill="#9a9aa8" font-size="11">CH343</text>
  <text x="920" y="204" fill="#9a9aa8" font-size="12">USB</text>
  <text x="920" y="220" fill="#9a9aa8" font-size="11">native</text>
  <path d="M 960 118 L 985 118" stroke="#38c8ff" stroke-width="2"/>
  <text x="944" y="160" fill="#38c8ff" font-size="11" font-weight="600">to PC</text>

  <!-- bottom header: 3V3 3V3 RST 4 5 6 7 15 16 17 18 8 3 46 9 10 11 12 13 14 5Vin GND -->
  <g font-size="11" text-anchor="middle" fill="#cfcfd8">
    <g id="pins">
      <circle cx="90" cy="268" r="6" fill="#c9a227"/><text x="90" y="250">3V3</text>
      <circle cx="126" cy="268" r="6" fill="#c9a227"/><text x="126" y="250">3V3</text>
      <circle cx="162" cy="268" r="6" fill="#c9a227"/><text x="162" y="250">RST</text>
      <circle cx="198" cy="268" r="6" fill="#c9a227"/><text x="198" y="250" fill="#ff9f1c" font-weight="700" font-size="13">4</text>
      <circle cx="234" cy="268" r="6" fill="#c9a227"/><text x="234" y="250">5</text>
      <circle cx="270" cy="268" r="6" fill="#c9a227"/><text x="270" y="250">6</text>
      <circle cx="306" cy="268" r="6" fill="#c9a227"/><text x="306" y="250">7</text>
      <circle cx="342" cy="268" r="6" fill="#c9a227"/><text x="342" y="250">15</text>
      <circle cx="378" cy="268" r="6" fill="#c9a227"/><text x="378" y="250">16</text>
      <circle cx="414" cy="268" r="6" fill="#c9a227"/><text x="414" y="250">17</text>
      <circle cx="450" cy="268" r="6" fill="#c9a227"/><text x="450" y="250">18</text>
      <circle cx="486" cy="268" r="6" fill="#c9a227"/><text x="486" y="250">8</text>
      <circle cx="522" cy="268" r="6" fill="#c9a227"/><text x="522" y="250">3</text>
      <circle cx="558" cy="268" r="6" fill="#c9a227"/><text x="558" y="250">46</text>
      <circle cx="594" cy="268" r="6" fill="#c9a227"/><text x="594" y="250">9</text>
      <circle cx="630" cy="268" r="6" fill="#c9a227"/><text x="630" y="250">10</text>
      <circle cx="666" cy="268" r="6" fill="#c9a227"/><text x="666" y="250">11</text>
      <circle cx="702" cy="268" r="6" fill="#c9a227"/><text x="702" y="250">12</text>
      <circle cx="738" cy="268" r="6" fill="#c9a227"/><text x="738" y="270" dy="-20">13</text>
      <circle cx="774" cy="268" r="6" fill="#c9a227"/><text x="774" y="270" dy="-20">14</text>
      <circle cx="810" cy="268" r="6" fill="#c9a227"/><text x="810" y="250" fill="#ff4d5e" font-weight="700">5Vin</text>
      <circle cx="846" cy="268" r="6" fill="#c9a227"/><text x="846" y="250" fill="#c08a5a" font-weight="700">GND</text>
    </g>
  </g>
  <circle cx="198" cy="268" r="10" fill="none" stroke="#ff9f1c" stroke-width="3"/>
  <circle cx="810" cy="268" r="10" fill="none" stroke="#ff4d5e" stroke-width="3"/>
  <circle cx="846" cy="268" r="10" fill="none" stroke="#c08a5a" stroke-width="3"/>

  <!-- wires -->
  <path d="M 404 440 C 404 360, 198 360, 198 278" fill="none" stroke="#ff9f1c" stroke-width="5" stroke-linecap="round"/>
  <path d="M 810 278 C 810 298, 790 302, 760 302 L 548 302 C 500 302, 416 330, 416 440" fill="none" stroke="#e63946" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 846 278 C 846 304, 826 310, 796 310 L 548 310 C 506 310, 428 342, 428 440" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- servo -->
  <rect x="330" y="440" width="190" height="80" rx="8" fill="#1a1a20" stroke="#c2185b" stroke-width="2"/>
  <rect x="345" y="455" width="110" height="50" rx="4" fill="#c2185b"/>
  <text x="400" y="486" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">MG90S</text>
  <circle cx="490" cy="480" r="16" fill="#d9d9df" stroke="#888"/>
  <text x="425" y="545" fill="#cfcfd8" font-size="12" text-anchor="middle">4.8-6 V  |  50 Hz  |  0.5-2.5 ms = 0-180 deg</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="40" y="318" width="250" height="96" rx="6" fill="#121218" stroke="#3a0d14"/>
    <text x="54" y="340" fill="#ff1f3d" font-weight="700">SERVO WIRE  ->  BOARD PIN</text>
    <rect x="54" y="352" width="14" height="10" fill="#ff9f1c"/><text x="76" y="362" fill="#ddd">orange (signal)  ->  GPIO4</text>
    <rect x="54" y="372" width="14" height="10" fill="#e63946"/><text x="76" y="382" fill="#ddd">red (+5 V)  ->  5Vin *</text>
    <rect x="54" y="392" width="14" height="10" fill="#8b5a2b"/><text x="76" y="402" fill="#ddd">brown (ground)  ->  GND</text>
  </g>
  <g font-size="12" fill="#cfcfd8">
    <rect x="560" y="318" width="420" height="250" rx="6" fill="#121218" stroke="#3a0d14"/>
    <text x="574" y="340" fill="#ff1f3d" font-weight="700" font-size="13">* POWERING THE SERVO</text>
    <text x="574" y="362">On this board 5Vin is NOT connected to USB power until</text>
    <text x="574" y="378">the "IN-OUT" solder pad is closed (one blob of solder).</text>
    <text x="574" y="402" fill="#22f0a0">Option A: close IN-OUT  -> 5Vin = USB 5 V. Fine for one</text>
    <text x="574" y="418" fill="#22f0a0">MG90S moving lightly.</text>
    <text x="574" y="442" fill="#38c8ff">Option B (best): a separate 5 V supply (4 x AA, or a</text>
    <text x="574" y="458" fill="#38c8ff">5 V / 2 A adapter): + to the servo's red wire, - to the</text>
    <text x="574" y="474" fill="#38c8ff">servo's brown wire AND to a board GND (shared ground).</text>
    <text x="574" y="498" fill="#ffb21e">Do not run the servo from 3V3: it is under-volted and</text>
    <text x="574" y="514" fill="#ffb21e">its current spikes can reset the ESP32.</text>
    <text x="574" y="540">Status LED: close the "RGB" pad to connect the RGB LED</text>
    <text x="574" y="556">to GPIO48 (it is open from the factory).</text>
  </g>
</svg>
