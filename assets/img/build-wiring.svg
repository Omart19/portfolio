<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Segoe UI, Bahnschrift, DejaVu Sans, Arial, sans-serif">
  <!-- SPIDER wiring diagram: servo powered from a breadboard power module (Elegoo MB102 style), signal from a YD-ESP32-S3. Drawn for this project. -->
  <rect width="1000" height="720" fill="#08080b"/>
  <text x="30" y="34" fill="#ff1f3d" font-size="20" font-weight="700">SERVO ON A BREADBOARD POWER MODULE  +  YD-ESP32-S3 (pin 4)</text>
  <text x="30" y="56" fill="#9a9aa8" font-size="13">Four connections. The ESP32 is powered by its USB cable; the servo only by the power module.</text>

  <!-- ESP32 board, front side up (module left, USB right) -->
  <rect x="180" y="90" width="640" height="210" rx="10" fill="#111116" stroke="#ff1f3d" stroke-width="2"/>
  <rect x="192" y="104" width="200" height="150" rx="4" fill="#1d1d24" stroke="#5a5a66"/>
  <text x="292" y="176" fill="#d8d8e0" font-size="14" text-anchor="middle" font-weight="600">ESP32-S3-WROOM-1</text>
  <text x="292" y="196" fill="#9a9aa8" font-size="12" text-anchor="middle">module end</text>
  <rect x="440" y="118" width="30" height="30" rx="4" fill="#2a2a30" stroke="#666"/>
  <text x="455" y="112" fill="#bbb" font-size="11" text-anchor="middle">RST</text>
  <rect x="486" y="118" width="30" height="30" rx="4" fill="#2a2a30" stroke="#666"/>
  <text x="501" y="112" fill="#bbb" font-size="11" text-anchor="middle">BOOT</text>
  <rect x="820" y="110" width="44" height="52" rx="8" fill="#3a3a44" stroke="#aaa"/>
  <rect x="820" y="186" width="44" height="52" rx="8" fill="#3a3a44" stroke="#aaa"/>
  <text x="842" y="141" fill="#38c8ff" font-size="11" text-anchor="middle">COM</text>
  <text x="842" y="217" fill="#9a9aa8" font-size="11" text-anchor="middle">USB</text>
  <path d="M 864 136 L 990 136" stroke="#38c8ff" stroke-width="3"/>
  <text x="874" y="158" fill="#38c8ff" font-size="12" font-weight="600">USB to PC</text>
  <text x="874" y="174" fill="#38c8ff" font-size="11">(powers the ESP32)</text>

  <!-- the 3V3 header row along the bottom edge: 3V3 3V3 RST 4 5 6 7 15 16 17 18 8 3 46 9 10 11 12 13 14 5Vin GND -->
  <g font-size="10" text-anchor="middle" fill="#cfcfd8">
    <circle cx="200" cy="286" r="5" fill="#c9a227"/><text x="200" y="268">3V3</text>
    <circle cx="228.6" cy="286" r="5" fill="#c9a227"/><text x="228.6" y="268">3V3</text>
    <circle cx="257.1" cy="286" r="5" fill="#c9a227"/><text x="257.1" y="268">RST</text>
    <circle cx="285.7" cy="286" r="5" fill="#c9a227"/><text x="285.7" y="268" fill="#ffcc00" font-weight="700" font-size="13">4</text>
    <circle cx="314.3" cy="286" r="5" fill="#c9a227"/><text x="314.3" y="268">5</text>
    <circle cx="342.9" cy="286" r="5" fill="#c9a227"/><text x="342.9" y="268">6</text>
    <circle cx="371.4" cy="286" r="5" fill="#c9a227"/><text x="371.4" y="268">7</text>
    <circle cx="400" cy="286" r="5" fill="#c9a227"/><text x="400" y="268">15</text>
    <circle cx="428.6" cy="286" r="5" fill="#c9a227"/><text x="428.6" y="268">16</text>
    <circle cx="457.1" cy="286" r="5" fill="#c9a227"/><text x="457.1" y="268">17</text>
    <circle cx="485.7" cy="286" r="5" fill="#c9a227"/><text x="485.7" y="268">18</text>
    <circle cx="514.3" cy="286" r="5" fill="#c9a227"/><text x="514.3" y="268">8</text>
    <circle cx="542.9" cy="286" r="5" fill="#c9a227"/><text x="542.9" y="268">3</text>
    <circle cx="571.4" cy="286" r="5" fill="#c9a227"/><text x="571.4" y="268">46</text>
    <circle cx="600" cy="286" r="5" fill="#c9a227"/><text x="600" y="268">9</text>
    <circle cx="628.6" cy="286" r="5" fill="#c9a227"/><text x="628.6" y="268">10</text>
    <circle cx="657.1" cy="286" r="5" fill="#c9a227"/><text x="657.1" y="268">11</text>
    <circle cx="685.7" cy="286" r="5" fill="#c9a227"/><text x="685.7" y="268">12</text>
    <circle cx="714.3" cy="286" r="5" fill="#c9a227"/><text x="714.3" y="268">13</text>
    <circle cx="742.9" cy="286" r="5" fill="#c9a227"/><text x="742.9" y="268">14</text>
    <circle cx="771.4" cy="286" r="5" fill="#666"/><text x="771.4" y="268" fill="#8a8a96">5Vin</text>
    <circle cx="800" cy="286" r="5" fill="#c9a227"/><text x="800" y="268" fill="#7fb2ff" font-weight="700">GND</text>
  </g>
  <circle cx="285.7" cy="286" r="10" fill="none" stroke="#ffcc00" stroke-width="3"/>
  <circle cx="800" cy="286" r="10" fill="none" stroke="#7fb2ff" stroke-width="3"/>
  <text x="785" y="318" fill="#8a8a96" font-size="11" text-anchor="end">leave 5Vin empty</text>

  <!-- breadboard rails fed by the power module -->
  <rect x="40" y="398" width="920" height="72" rx="6" fill="#16161c" stroke="#2a2a33"/>
  <line x1="200" y1="416" x2="950" y2="416" stroke="#e63946" stroke-width="4"/>
  <text x="944" y="410" fill="#ff6b78" font-size="12" text-anchor="end" font-weight="700">+  5 V rail</text>
  <line x1="200" y1="452" x2="950" y2="452" stroke="#3a7bd5" stroke-width="4"/>
  <text x="944" y="468" fill="#7fb2ff" font-size="12" text-anchor="end" font-weight="700">-  GND rail</text>

  <!-- power module -->
  <rect x="40" y="330" width="160" height="160" rx="8" fill="#1a1a22" stroke="#4caf50" stroke-width="2"/>
  <text x="120" y="352" fill="#d8d8e0" font-size="13" text-anchor="middle" font-weight="600">power module</text>
  <text x="120" y="368" fill="#9a9aa8" font-size="11" text-anchor="middle">(Elegoo MB102)</text>
  <circle cx="56" cy="390" r="5" fill="#4caf50"/>
  <text x="66" y="394" fill="#4caf50" font-size="11">on</text>
  <rect x="118" y="380" width="70" height="20" rx="3" fill="#2a2a30" stroke="#888"/>
  <text x="128" y="395" fill="#bbb" font-size="10">3.3</text>
  <rect x="150" y="381" width="34" height="18" rx="2" fill="#ffcc00"/>
  <text x="167" y="395" fill="#111" font-size="11" text-anchor="middle" font-weight="700">5V</text>
  <text x="153" y="414" fill="#ffcc00" font-size="10" text-anchor="middle">jumper on 5V</text>
  <path d="M 200 416 L 186 416" stroke="#e63946" stroke-width="4"/>
  <path d="M 200 452 L 186 452" stroke="#3a7bd5" stroke-width="4"/>
  <text x="62" y="438" fill="#ff6b78" font-size="11">VCC</text>
  <text x="62" y="470" fill="#7fb2ff" font-size="11">GND</text>
  <path d="M 10 506 L 40 470" stroke="#999" stroke-width="3"/>
  <text x="14" y="526" fill="#cfcfd8" font-size="12">6.5-12 V DC adapter</text>
  <text x="14" y="542" fill="#9a9aa8" font-size="11">(barrel jack)</text>

  <!-- the shared ground: GND rail to ESP32 GND -->
  <path d="M 800 296 L 800 452" stroke="#7fb2ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="800" cy="452" r="7" fill="#7fb2ff"/>
  <text x="812" y="352" fill="#7fb2ff" font-size="13" font-weight="700">4: shared ground</text>
  <text x="812" y="369" fill="#9fc4ff" font-size="11">GND rail -&gt; ESP32 GND</text>
  <text x="812" y="384" fill="#9fc4ff" font-size="11">(the servo needs this!)</text>

  <!-- servo -->
  <rect x="330" y="560" width="200" height="86" rx="8" fill="#1a1a20" stroke="#c2185b" stroke-width="2"/>
  <rect x="344" y="576" width="120" height="54" rx="4" fill="#c2185b"/>
  <text x="404" y="600" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">SG90 /</text>
  <text x="404" y="620" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">MG90S</text>
  <circle cx="500" cy="603" r="15" fill="#d9d9df" stroke="#888"/>

  <!-- 1: signal, pin 4 -> servo signal (orange / yellow) -->
  <path d="M 285.7 296 L 285.7 380 C 285.7 400, 300 410, 300 430 L 300 520 C 300 545, 360 545, 372 560" fill="none" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="600" fill="#ffcc00" font-size="13" font-weight="700">1: signal</text>
  <text x="100" y="617" fill="#ffe680" font-size="11">servo orange / yellow</text>
  <text x="100" y="632" fill="#ffe680" font-size="11">-&gt; row of ESP32 pin 4</text>
  <!-- 2: servo red -> + rail -->
  <path d="M 404 560 L 404 416" stroke="#e63946" stroke-width="5" stroke-linecap="round"/>
  <circle cx="404" cy="416" r="7" fill="#e63946"/>
  <text x="452" y="500" fill="#ff6b78" font-size="12" font-weight="700">2: red -&gt; + rail</text>
  <!-- 3: servo brown -> - rail -->
  <path d="M 440 560 L 440 452" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="440" cy="452" r="7" fill="#8b5a2b"/>
  <text x="452" y="520" fill="#c08a5a" font-size="12" font-weight="700">3: brown -&gt; - rail</text>

  <!-- notes -->
  <g font-size="12" fill="#cfcfd8">
    <rect x="590" y="490" width="396" height="214" rx="6" fill="#121218" stroke="#3a0d14"/>
    <text x="604" y="512" fill="#ff1f3d" font-weight="700" font-size="13">CHECK</text>
    <text x="604" y="534">- Module jumper on <tspan fill="#ffcc00" font-weight="700">5V</tspan> (3.3 V is too weak for the servo).</text>
    <text x="604" y="554">- Follow the module's own VCC / GND print: some</text>
    <text x="604" y="570">  modules sit on the rails the other way round.</text>
    <text x="604" y="590">- Use different wire colours for + and -: swapping</text>
    <text x="604" y="606">  them can kill a servo (try a fresh one if unsure).</text>
    <text x="604" y="626">- Nothing from the module to the ESP32's 5Vin / 3V3.</text>
    <text x="604" y="646">- Long breadboards split their rails in the middle.</text>
    <text x="604" y="670" fill="#22f0a0">Then: Control Deck &gt; Check signal = "signal OK",</text>
    <text x="604" y="686" fill="#22f0a0">and the servo follows the angle slider.</text>
  </g>
</svg>
